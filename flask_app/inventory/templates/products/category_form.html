{% extends 'base.html' %}

{% block title %}{{ title }} - Inventory System{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1><i class="fas fa-tag me-2"></i>{{ title }}</h1>
    </div>
    <a href="{{ url_for('products.category_list') }}" class="btn btn-outline"><i class="fas fa-arrow-left me-1"></i>Back
        to Categories</a>
</div>

<div style="max-width: 560px;">
    <div class="card">
        <div class="card-body">
            <form method="post" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                {% if errors %}
                <div class="alert alert-danger">
                    <i class="fas fa-times-circle"></i>
                    Please correct the errors below.
                </div>
                {% endif %}

                <div class="form-group">
                    <label for="id_name">Category Name *</label>
                    <input type="text" name="name" id="id_name"
                        class="form-control {% if errors.get('name') %}is-invalid{% endif %}"
                        value="{{ request.form.get('name', category.name if category else '') }}"
                        placeholder="e.g. Electronics, Clothing" required>
                    {% if errors.get('name') %}<div class="invalid-feedback">{{ errors.name }}</div>{% endif %}
                </div>

                <div class="form-group">
                    <label for="id_description">Description</label>
                    <textarea name="description" id="id_description"
                        class="form-control {% if errors.get('description') %}is-invalid{% endif %}" rows="3"
                        placeholder="Brief description of this category (optional)">{{ request.form.get('description', (category.description or '') if category else '') }}</textarea>
                </div>

                <div class="d-flex justify-between">
                    <a href="{{ url_for('products.category_list') }}" class="btn btn-outline">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i>{% if 'Edit' in title %}Save Changes{% else %}Create
                        Category{% endif %}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
