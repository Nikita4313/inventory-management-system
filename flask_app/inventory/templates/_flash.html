{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="toast-container">
    {% for category, message in messages %}
    <div class="alert alert-{{ category }}" id="msg-{{ loop.index }}">
        <i class="fas {% if category == 'success' %}fa-check-circle{% elif category == 'danger' %}fa-times-circle{% elif category == 'warning' %}fa-exclamation-circle{% else %}fa-info-circle{% endif %}"></i>
        {{ message }}
        <button class="close-btn" onclick="this.parentElement.remove()">&times;</button>
    </div>
    {% endfor %}
</div>
{% endif %}
{% endwith %}
