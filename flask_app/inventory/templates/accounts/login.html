{% extends 'base.html' %}

{% block title %}Login - Inventory System{% endblock %}

{% block auth_content %}
<div class="auth-layout">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo"><i class="fas fa-boxes-stacked"></i></div>
            <h1>Welcome Back</h1>
            <p>Sign in to your inventory account</p>
        </div>

        {% include '_flash.html' %}

        {% if error %}
        <div class="alert alert-danger">
            <i class="fas fa-times-circle"></i>
            {{ error }}
        </div>
        {% endif %}

        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" class="form-control"
                    placeholder="Enter your username" value="{{ request.form.get('username', '') }}" required autofocus>
            </div>
            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" class="form-control"
                    placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Sign Up</a>
        </div>
    </div>
</div>
{% endblock %}
