<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .error-container { text-align: center; color: white; }
        .error-code { font-size: 120px; font-weight: bold; margin: 0; }
        .error-message { font-size: 24px; margin-bottom: 20px; }
        a { color: white; text-decoration: none; padding: 10px 20px; background: rgba(255,255,255,0.2); border-radius: 5px; display: inline-block; margin-top: 20px; }
        a:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-message">Page Not Found</div>
        <p>The page you're looking for doesn't exist.</p>
        <a href="{{ url_for('products.dashboard') }}">Return to Dashboard</a>
    </div>
</body>
</html>
